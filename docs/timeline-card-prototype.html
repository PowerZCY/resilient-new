<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时间轴卡片设计原型</title>
  <link rel="stylesheet" href="css/timeline-card.css">
</head>
<body>
  <h1>时间轴卡片设计原型</h1>
  
  <div class="container">
    <!-- 分组导航，将由JS动态创建 -->
    <div class="group-nav"></div>

    <!-- 卡片容器，将由JS动态创建 -->
    <div class="carousel-container"></div>
    
    <!-- 模态框 -->
    <div class="modal-overlay">
      <div class="content-modal">
        <button class="modal-close">&times;</button>
        <div class="modal-date"></div>
        <div class="modal-content"></div>
      </div>
    </div>
  </div>
  
  <!-- 引入数据文件 -->
  <script src="js/timeline-data.js"></script>
  <!-- 引入统一交互逻辑文件 -->
  <script src="js/timeline-card.js"></script>
</body>
</html>
